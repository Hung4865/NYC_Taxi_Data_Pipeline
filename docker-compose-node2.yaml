version: "3.8"

services:
  # ==========================================
  # 1. POSTGRESQL (Data Warehouse & Metastore)
  # ==========================================
  postgresql:
    image: postgres:latest
    command: ["postgres", "-c", "wal_level=logical"]
    container_name: dw-postgresql
    healthcheck:
      test: ["CMD", "psql", "-U", "k6", "-c", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=k6
      - POSTGRES_USER=k6
      - POSTGRES_PASSWORD=k6
    volumes:
      - dw_postgres_data:/var/lib/postgresql/data

  metastore_db:
    container_name: datalake-metastore-db
    image: postgres:11
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: metastore

  # ==========================================
  # 2. HIVE METASTORE
  # ==========================================
  hive-metastore:
    container_name: datalake-hive-metastore
    image: "starburstdata/hive:3.1.2-e.18"
    ports:
      - "9083:9083"
    environment:
      HIVE_METASTORE_DRIVER: org.postgresql.Driver
      HIVE_METASTORE_JDBC_URL: jdbc:postgresql://metastore_db:5432/metastore
      HIVE_METASTORE_USER: hive
      HIVE_METASTORE_PASSWORD: hive
      HIVE_METASTORE_WAREHOUSE_DIR: hdfs://100.94.95.107:8020/user/hive/warehouse
      REGION: ""
      GOOGLE_CLOUD_KEY_FILE_PATH: ""
      AZURE_ADL_CLIENT_ID: ""
      AZURE_ADL_CREDENTIAL: ""
      AZURE_ADL_REFRESH_URL: ""
      AZURE_ABFS_STORAGE_ACCOUNT: ""
      AZURE_ABFS_ACCESS_KEY: ""
      AZURE_WASB_STORAGE_ACCOUNT: ""
      AZURE_ABFS_OAUTH: ""
      AZURE_ABFS_OAUTH_TOKEN_PROVIDER: ""
      AZURE_ABFS_OAUTH_CLIENT_ID: ""
      AZURE_ABFS_OAUTH_SECRET: ""
      AZURE_ABFS_OAUTH_ENDPOINT: ""
      AZURE_WASB_ACCESS_KEY: ""
    depends_on:
      - metastore_db

  # ==========================================
  # 3. TRINO QUERY ENGINE
  # ==========================================
  trino:
    ports:
      - "8084:8080"
    container_name: datalake-trino
    image: "trinodb/trino:410"
    volumes:
      - ./infra/query_engine/etc:/usr/lib/trino/etc:ro
      - ./infra/query_engine/catalog:/etc/trino/catalog
    depends_on:
      - hive-metastore

  # ==========================================
  # 4. HADOOP DATANODE (HDFS Storage Node)
  # ==========================================
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datalake-datanode
    ports:
      - "9864:9864"
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://100.94.95.107:8020
      - SERVICE_PRECONDITION=100.94.95.107:9870
    env_file:
      - ./infra/configurations/hadoop.env

volumes:
  dw_postgres_data:
  hadoop_datanode:
